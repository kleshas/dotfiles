[global]
    ### Display ###
    monitor = 0
    follow = mouse
    width = (0, 300)
    height = 200
    origin = top-right
    offset = 10x50
    scale = 0
    notification_limit = 5
    font = JetBrainsMono Nerd Font Regular 11

    ### Progress bar ###
    progress_bar = true
    progress_bar_height = 8
    progress_bar_frame_width = 1
    progress_bar_min_width = 150
    progress_bar_max_width = 300

    ### Text and Geometry ###
    indicate_hidden = yes
    transparency = 0
    separator_height = 2
    padding = 12
    horizontal_padding = 12
    text_icon_padding = 12
    frame_width = 2
    
    ### Gruvbox Dark Border Colors (Aqua/Cyan Accent) ###
    frame_color = "#689d6a"
    separator_color = "#689d6a"

    ### Sort and Miscellany ###
    sort = yes
    idle_threshold = 120
    line_height = 0
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    vertical_alignment = center
    show_age_threshold = 60
    ellipsize = middle
    ignore_newline = no
    stack_duplicates = true
    hide_duplicate_count = false
    show_indicators = yes

    ### Icons ###
    icon_position = left
    min_icon_size = 32
    max_icon_size = 64
    icon_theme = "Adwaita"

    ### History ###
    sticky_history = yes
    history_length = 20

    ### Misc anchoring ###
    dmenu = /usr/bin/dmenu -p dunst:
    browser = /usr/bin/xdg-open
    always_run_script = true
    title = Dunst
    class = Dunst
    corner_radius = 8
    
    # Modern cursor mouse handling
    mouse_left_click = close_current
    mouse_middle_click = do_action
    mouse_right_click = close_all

[experimental]
    per_monitor_dpi = false

[urgency_low]
    # Background: Dark0, Foreground: Dark Fg3, Frame: Gray
    background = "#282828"
    foreground = "#bdae93"
    frame_color = "#928374"
    timeout = 5

[urgency_normal]
    # Background: Dark0, Foreground: Light Fg1, Frame: Aqua
    background = "#282828"
    foreground = "#ebdbb2"
    frame_color = "#689d6a"
    timeout = 10

[urgency_critical]
    # Background: Dark0, Foreground: Bright Red, Frame: Bright Red
    background = "#282828"
    foreground = "#fb4934"
    frame_color = "#fb4934"
    timeout = 0
