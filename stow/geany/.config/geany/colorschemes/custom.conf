[theme_info]
name=wpgtk Dynamic Scheme
description=A dynamic colorscheme managed by wpgtk
version=1.0.0
author=wpgtk

[named_colors]
# Primary Background and Foregrounds
bg_base=#0f0504
bg_dark=#929797
fg_text=#8C9B69
fg_muted=#d1d8d9

# Dynamic Accent Colors
color_red=#8C9B69
color_green=#708B49
color_yellow=#798A84
color_blue=#656C53
color_magenta=#9EA79D
color_cyan=#3A5C49

# Interactive UI Blocks
ui_selection=#708B49
ui_current_line=#929797

[theme_colors]
# Background and default text
default=fg_text;bg_base;false;false
# Highlighted selection styling (Overrides bg color, keeps text readable)
selection=fg_text;ui_selection;false;true
# Current line background highlight
current_line=fg_text;ui_current_line;false;true
# Blinking cursor bar
cursor=color_blue;;false;false
# Left margin & Line numbers
line_number=fg_muted;bg_dark;false;false
# Bracket matching highlight
bracket_match=bg_base;color_green;true;false
bracket_mismatch=bg_base;color_red;true;false

[named_styles]
# Standard Syntax Highlighting
default=fg_text;bg_base;false;false
comment=fg_muted;;false;true
keyword=color_magenta;;true;false
statement=color_magenta;;true;false
type=color_yellow;;false;false
number=color_blue;;false;false
string=color_green;;false;false
character=color_green;;false;false
operator=color_cyan;;false;false
preprocessor=color_blue;;false;false
tag=color_blue;;true;false
attribute=color_yellow;;false;false
identifier=fg_text;;false;false
class=color_yellow;;true;false
function=color_blue;;false;false

# Errors & Warnings
error=color_red;;true;false
warning=color_yellow;;true;false
